name = "video-short-cron"
main = "worker.js"
compatibility_date = "2026-11-11"

# Satu dispatch per akun per tick. Akun baru hanya masuk daftar ini setelah ID Buffer di src/accounts.ts
# dan GitHub Environment-nya terisi (lihat docs/PUBLISHING.md § Channel IDs).
[vars]
ACCOUNTS = "kali-aja,ai-labs,cerpenek,sastra-mesin"

[triggers]
crons = ["30 0,2,4,5,9,12 * * *"]
